<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>UNIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=Barlow:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--bg2:#111111;--bg3:#1a1a1a;--bg4:#222222;--bg5:#2a2a2a;
  --border:#2a2a2a;--border2:#333333;--border3:#444444;
  --text:#f0f0f0;--text2:#888888;--text3:#555555;
  --lime:#c6ff00;--lime-dim:rgba(198,255,0,.08);--lime-dim2:rgba(198,255,0,.15);--lime-glow:rgba(198,255,0,.25);
  --done:#39d353;--red:#ff4444;--blue:#4488ff;--orange:#ff8800;--purple:#aa66ff;
  --ease:cubic-bezier(.4,0,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);--ease-spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{background:var(--bg);scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;min-height:100vh;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");background-size:200px}
.header{position:sticky;top:0;z-index:200;background:rgba(10,10,10,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px}
.content{padding:12px 14px calc(80px + env(safe-area-inset-bottom,0px));position:relative;z-index:2}
.week-bar{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(10,10,10,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;justify-content:center}
.h-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;letter-spacing:.15em;color:var(--lime);line-height:1;text-transform:uppercase}
.logo span{color:var(--text3);font-weight:400}
.h-right-group{display:flex;align-items:center;gap:8px}
.h-dayname{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text2);text-align:right}
.h-badge{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:3px;margin-left:6px;vertical-align:middle}
.bstr{background:rgba(68,136,255,.12);color:var(--blue)}.bvol{background:rgba(198,255,0,.1);color:var(--lime)}.brst{background:var(--bg3);color:var(--text3)}
.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.prog-track{flex:1;height:2px;background:var(--border2);border-radius:1px;overflow:hidden}
.prog-fill{height:100%;background:var(--lime);border-radius:1px;transition:width .6s var(--ease-out);box-shadow:0 0 8px var(--lime-glow)}
.prog-pct{font-family:'DM Mono',monospace;font-size:11px;color:var(--lime);min-width:34px;text-align:right;font-weight:500}
.day-tabs{display:flex;gap:2px}
.day-tab{flex:1;min-width:0;padding:8px 2px;border-radius:5px;background:transparent;border:1px solid transparent;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-align:center;cursor:pointer;color:var(--text3);text-transform:uppercase;transition:all .18s var(--ease);-webkit-user-select:none;user-select:none}
.day-tab:active{transform:scale(.93)}
.day-tab.active{background:var(--lime);border-color:var(--lime);color:#000;box-shadow:0 0 12px var(--lime-glow)}
.mode-bar{display:flex;gap:0;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:3px;margin-bottom:12px}
.mode-btn{flex:1;padding:8px 6px;border-radius:5px;border:none;background:none;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);cursor:pointer;transition:all .2s;-webkit-user-select:none;user-select:none}
.mode-btn:active{transform:scale(.96)}
.mode-btn.active{background:var(--bg5);color:var(--text);border:1px solid var(--border2)}
.icon-btn{position:relative;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:7px 9px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s var(--ease);min-height:36px;min-width:36px;flex-shrink:0}
.icon-btn:active{background:var(--bg4);transform:scale(.93)}
.icon-btn svg{width:18px;height:18px;stroke:var(--text2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.icon-btn.sync-on svg{stroke:var(--lime)}
.icon-btn.sync-on{border-color:rgba(198,255,0,.3);background:var(--lime-dim)}
.cart-badge{position:absolute;top:-5px;right:-5px;background:var(--lime);color:#000;font-family:'DM Mono',monospace;font-size:9px;font-weight:500;border-radius:10px;padding:2px 5px;min-width:18px;text-align:center;border:2px solid var(--bg);display:none;line-height:1.2}
.cart-badge.show{display:block}
/* SYNC */
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--text3);vertical-align:middle;flex-shrink:0}
.sync-dot.live{background:var(--lime);box-shadow:0 0 6px var(--lime);animation:pdot 2s infinite}
.sync-dot.coach{background:var(--purple);box-shadow:0 0 6px var(--purple)}
.sync-dot.err{background:var(--red)}
@keyframes pdot{0%,100%{opacity:1}50%{opacity:.4}}
.sync-bar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}
.sync-bar-label{flex:1}
.sync-last{font-family:'DM Mono',monospace;font-size:9px;color:var(--text3);letter-spacing:.02em;text-transform:none;font-weight:400}
/* FULLSCREEN REST TIMER */
.fs-timer{position:fixed;inset:0;z-index:999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.fs-timer.active{opacity:1;pointer-events:auto}
.fs-timer-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(198,255,0,.06) 0%,transparent 65%);pointer-events:none}
.fs-ex-name{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);margin-bottom:48px;text-align:center;padding:0 32px;max-width:340px}
.fs-ring-wrap{position:relative;width:280px;height:280px;flex-shrink:0}
.fs-ring-svg{width:280px;height:280px;transform:rotate(-90deg)}
.fs-ring-track{fill:none;stroke:#1a1a1a;stroke-width:6}
.fs-ring-fill{fill:none;stroke:var(--lime);stroke-width:6;stroke-linecap:round;stroke-dasharray:804.247719;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear;filter:drop-shadow(0 0 8px rgba(198,255,0,.6))}
.fs-ring-glow{fill:none;stroke:var(--lime);stroke-width:14;stroke-linecap:round;stroke-dasharray:804.247719;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear;opacity:.08}
.fs-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.fs-time{font-family:'DM Mono',monospace;font-size:72px;font-weight:500;color:var(--lime);line-height:1;letter-spacing:-.03em;text-shadow:0 0 30px rgba(198,255,0,.3)}
.fs-rest-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.25em;text-transform:uppercase;color:var(--text3);margin-top:6px}
.fs-actions{display:flex;gap:10px;margin-top:52px;align-items:center}
.fs-btn{padding:13px 22px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);cursor:pointer;transition:all .15s;min-height:46px}
.fs-btn:active{background:var(--bg4);transform:scale(.95)}
.fs-btn.skip{background:var(--lime);border-color:var(--lime);color:#000;padding:13px 32px;font-size:14px;box-shadow:0 0 20px var(--lime-glow)}
.fs-btn.skip:active{background:#aadd00;transform:scale(.97)}
.fs-next{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);left:0;right:0;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--text3)}
@keyframes timerFinish{0%{background:#000}15%{background:rgba(198,255,0,.12)}100%{background:#000}}
.fs-timer.finish{animation:timerFinish .6s ease}
/* SECTIONS */
.section{background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:6px;overflow:hidden;transition:border-color .2s}
.section.open-section{border-color:var(--border2)}
.sec-head{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;-webkit-user-select:none;user-select:none;min-height:56px;transition:background .15s}
.sec-head:active{background:var(--bg3)}
.sec-icon{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:.04em;flex-shrink:0;text-transform:uppercase}
.ic-am{background:rgba(255,136,0,.1);color:var(--orange)}.ic-m{background:rgba(57,211,83,.08);color:var(--done)}.ic-wk{background:rgba(68,136,255,.1);color:var(--blue)}.ic-pc{background:rgba(255,68,68,.1);color:var(--red)}.ic-sp{background:var(--lime-dim);color:var(--lime)}.ic-h2o{background:rgba(68,136,255,.08);color:var(--blue)}
.sec-title{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text);line-height:1.1;min-width:0}
.sec-sub{font-size:11px;font-weight:400;color:var(--text3);display:block;text-transform:none;letter-spacing:0;font-family:'Barlow',sans-serif;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-count{font-family:'DM Mono',monospace;font-size:12px;color:var(--text3);flex-shrink:0;text-align:right;transition:color .2s}
.sec-count.done{color:var(--done)}
.sec-chev{font-size:9px;color:var(--text3);transition:transform .25s var(--ease-out);flex-shrink:0;margin-left:4px}
.sec-chev.open{transform:rotate(180deg)}
.sec-body{display:none;border-top:1px solid var(--border);padding:4px 14px 12px}
.sec-body.open{display:block;animation:expand .3s var(--ease-out)}
@keyframes expand{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
/* CHECKLIST */
.ci{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer;min-height:50px;transition:opacity .1s;-webkit-user-select:none;user-select:none}
.ci:last-child{border-bottom:none}
.ci:active{opacity:.5}
.cb{width:22px;height:22px;border:1.5px solid var(--border3);border-radius:5px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease-out);background:var(--bg3)}
.cb.done{background:var(--done);border-color:var(--done);box-shadow:0 0 0 3px rgba(57,211,83,.12)}
.ck{width:11px;height:8px;border-left:2.5px solid #000;border-bottom:2.5px solid #000;transform:rotate(-45deg) translateY(-1px);display:none}
.cb.done .ck{display:block;animation:pop .25s var(--ease-spring)}
@keyframes pop{0%{transform:rotate(-45deg) translateY(-1px) scale(0)}70%{transform:rotate(-45deg) translateY(-1px) scale(1.3)}100%{transform:rotate(-45deg) translateY(-1px) scale(1)}}
.ci-text{font-family:'Barlow',sans-serif;font-size:14px;color:var(--text);line-height:1.4;transition:color .2s}
.ci-text.done{color:var(--text3);text-decoration:line-through;text-decoration-color:var(--text3)}
.ci-note{font-size:11px;color:var(--text3);margin-top:3px;font-family:'Barlow',sans-serif;line-height:1.4}
/* EXERCISES */
.ex-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:10px;margin-bottom:5px;overflow:hidden;transition:border-color .2s}
.ex-wrap.ex-open{border-color:var(--border3)}
.ex-head{display:flex;align-items:center;gap:10px;padding:13px 12px;cursor:pointer;-webkit-user-select:none;user-select:none;min-height:54px;transition:background .15s}
.ex-head:active{background:var(--bg4)}
.ex-num-badge{width:26px;height:26px;border-radius:5px;background:var(--bg4);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);flex-shrink:0}
.ex-info{flex:1;min-width:0}
.ex-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--text);line-height:1.2;word-break:break-word;text-transform:uppercase}
.ex-meta{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);margin-top:4px;letter-spacing:.01em}
.ex-prog{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--text3);flex-shrink:0;min-width:28px;text-align:right;transition:color .2s}
.ex-prog.full{color:var(--done)}
.ex-chev{font-size:9px;color:var(--text3);transition:transform .25s var(--ease-out);flex-shrink:0;margin-left:3px}
.ex-chev.open{transform:rotate(180deg)}
.ex-body{display:none;border-top:1px solid var(--border);padding:4px 12px 10px}
.ex-body.open{display:block;animation:expand .3s var(--ease-out)}
/* SET ROWS */
.set-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);min-height:54px}
.set-row:last-child{border-bottom:none}
.set-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);width:36px;flex-shrink:0;text-align:center;line-height:1.3;text-transform:uppercase;letter-spacing:.04em}
.set-label.sdone{color:var(--done)}
.set-w-input{width:74px;background:var(--bg4);border:1px solid var(--border2);border-radius:7px;padding:10px 6px;font-family:'DM Mono',monospace;font-size:17px;color:var(--text);outline:none;transition:all .18s;text-align:center;flex-shrink:0;-webkit-appearance:none;-moz-appearance:textfield}
.set-w-input::-webkit-outer-spin-button,.set-w-input::-webkit-inner-spin-button{-webkit-appearance:none}
.set-w-input:focus{border-color:var(--lime);background:rgba(198,255,0,.05);box-shadow:0 0 0 3px rgba(198,255,0,.08)}
.set-r-input{width:52px;background:var(--bg4);border:1px solid var(--border2);border-radius:7px;padding:10px 6px;font-family:'DM Mono',monospace;font-size:17px;color:var(--text);outline:none;transition:all .18s;text-align:center;flex-shrink:0;-webkit-appearance:none;-moz-appearance:textfield}
.set-r-input::-webkit-outer-spin-button,.set-r-input::-webkit-inner-spin-button{-webkit-appearance:none}
.set-r-input:focus{border-color:var(--lime);background:rgba(198,255,0,.05);box-shadow:0 0 0 3px rgba(198,255,0,.08)}
.set-sep{font-family:'DM Mono',monospace;font-size:14px;color:var(--text3);flex-shrink:0;padding:0 1px}
.set-logged{font-family:'DM Mono',monospace;font-size:13px;color:var(--done);flex:1;padding-left:6px}
.set-spacer{flex:1}
.set-done-btn{padding:11px 18px;border-radius:7px;border:1px solid var(--border3);background:var(--bg4);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--text2);cursor:pointer;text-transform:uppercase;transition:all .15s var(--ease);flex-shrink:0;min-height:44px}
.set-done-btn:active{background:var(--lime-dim2);border-color:var(--lime);color:var(--lime);transform:scale(.95)}
.set-undo-btn{padding:8px 10px;border-radius:6px;border:1px solid var(--border);background:none;font-size:10px;color:var(--text3);cursor:pointer;flex-shrink:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.08em;min-height:38px;transition:all .15s}
.set-undo-btn:active{color:var(--text);border-color:var(--border3)}
.set-done-icon{width:22px;height:22px;background:var(--done);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 0 3px rgba(57,211,83,.1)}
.set-done-icon::after{content:'';width:11px;height:8px;border-left:2.5px solid #000;border-bottom:2.5px solid #000;transform:rotate(-45deg) translateY(-1px);display:block}
.set-ctrl-row{display:flex;gap:6px;padding:8px 0 2px;border-top:1px solid var(--border);margin-top:2px}
.set-ctrl-btn{flex:1;padding:9px 10px;border-radius:7px;border:1px solid var(--border);background:none;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);cursor:pointer;min-height:38px;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px}
.set-ctrl-btn:active{color:var(--text);border-color:var(--border3);background:var(--bg4)}
.set-ctrl-btn.add{color:var(--lime);border-color:rgba(198,255,0,.2)}
.set-ctrl-btn.add:active{background:var(--lime-dim);border-color:var(--lime)}
.set-ctrl-btn.rm{color:#886060}
.set-ctrl-btn.rm:active{color:var(--red);border-color:rgba(255,68,68,.3);background:rgba(255,68,68,.06)}
.set-ctrl-btn:disabled{opacity:.25;pointer-events:none}
.ex-actions{display:flex;gap:6px;padding:6px 0 0}
.ex-rm-btn{flex:1;padding:9px;border-radius:7px;border:1px solid rgba(255,68,68,.12);background:rgba(255,68,68,.04);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#885555;cursor:pointer;min-height:36px;transition:all .15s}
.ex-rm-btn:active{background:rgba(255,68,68,.12);color:var(--red);border-color:var(--red)}
.add-btn{width:100%;padding:14px;margin-top:6px;border-radius:9px;border:1px dashed var(--border2);background:none;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);cursor:pointer;min-height:46px;transition:all .18s var(--ease);display:flex;align-items:center;justify-content:center;gap:8px}
.add-btn svg{width:13px;height:13px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.add-btn:active{color:var(--lime);border-color:var(--lime);background:var(--lime-dim);transform:scale(.98)}
/* MACROS */
.macros-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:6px}
.mac{background:var(--bg2);padding:10px 8px;text-align:center}
.mac-val{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;color:var(--text)}
.mac-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;margin-top:2px;font-family:'Barlow Condensed',sans-serif;font-weight:700}
/* WATER */
.water-body{padding:12px 14px;border-top:1px solid var(--border)}
.water-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--text3);text-transform:uppercase;margin-bottom:12px}
.drops{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.drop{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border2);background:var(--bg3);cursor:pointer;transition:all .2s var(--ease-out);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.drop.filled{background:rgba(68,136,255,.15);border-color:var(--blue);box-shadow:0 0 0 3px rgba(68,136,255,.08)}
.drop:active{transform:scale(.85)}
.drop-inner{width:12px;height:14px;background:var(--border3);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transition:background .2s}
.drop.filled .drop-inner{background:var(--blue)}
.water-count{font-family:'DM Mono',monospace;font-size:14px;color:var(--blue);margin-left:8px;font-weight:500}

function initAudio(){if(audioCtx)return;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function playAlarm(){try{if(!audioCtx)initAudio();if(!audioCtx||audioCtx.state==='closed')return;if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime;const mc=()=>{const s=audioCtx.createWaveShaper();const c=new Float32Array(512);for(let i=0;i<512;i++){const x=i*2/511-1;c[i]=Math.tanh(x*4)*.7;}s.curve=c;return s;};[{t:0,f:880,d:.14},{t:.18,f:1046,d:.14},{t:.36,f:1319,d:.22},{t:.72,f:880,d:.14},{t:.9,f:1046,d:.14},{t:1.08,f:1319,d:.3}].forEach(({t,f,d})=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),c=mc();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(0,now+t);g.gain.linearRampToValueAtTime(.55,now+t+.01);g.gain.setValueAtTime(.55,now+t+d*.75);g.gain.exponentialRampToValueAtTime(.001,now+t+d);o.connect(c);c.connect(g);g.connect(audioCtx.destination);o.start(now+t);o.stop(now+t+d+.05);});}catch(e){}}
function unlockAudio(){initAudio();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}

async function setupSW(){if(!('serviceWorker'in navigator))return;const code=`let t;self.addEventListener('message',e=>{if(!e||!e.data)return;if(e.data.type==='SCHEDULE'){clearTimeout(t);t=setTimeout(()=>{try{self.registration.showNotification('Rest Complete!',{body:e.data.ex,vibrate:[200,100,200,100,400],tag:'rest'})}catch(err){}},e.data.ms)}if(e.data.type==='CANCEL')clearTimeout(t)});`;try{const u=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));swReg=await navigator.serviceWorker.register(u);await navigator.serviceWorker.ready;}catch(e){swReg=null;}}
async function rqNP(){if(!('Notification'in window))return false;if(Notification.permission==='granted')return true;if(Notification.permission==='denied')return false;try{return(await Notification.requestPermission())==='granted';}catch(e){return false;}}
function postSW(d){if(!swReg)return;const s=swReg.active||swReg.waiting||swReg.installing;if(s)try{s.postMessage(d);}catch(e){}}

async function startRestTimer(secs,name){if(!secs)return;clearInterval(restInterval);restEndTime=Date.now()+secs*1000;restTotalSecs=secs;restExName=name;try{localStorage.setItem('trk-timer',JSON.stringify({end:restEndTime,total:restTotalSecs,ex:restExName}));}catch(e){}showFST();reqWL();updateTimer();restInterval=setInterval(tick,250);const g=await rqNP();if(g)postSW({type:'SCHEDULE',ms:secs*1000,ex:name+' — next set'});}
function tick(){if(Math.ceil((restEndTime-Date.now())/1000)<=0)finishTimer();else updateTimer();}
function finishTimer(){clearInterval(restInterval);restInterval=null;restEndTime=0;try{localStorage.removeItem('trk-timer');}catch(e){}const fst=document.getElementById('fs-timer');fst.classList.add('finish');setTimeout(()=>fst.classList.remove('finish'),700);hideFST();relWL();postSW({type:'CANCEL'});playAlarm();if(navigator.vibrate)navigator.vibrate([200,100,200,100,400,100,300]);showToast('Rest done — next set!');}
function updateTimer(){if(!restEndTime)return;const left=Math.max(0,Math.ceil((restEndTime-Date.now())/1000)),m=Math.floor(left/60),s=left%60;const te=document.getElementById('fs-time'),ee=document.getElementById('fs-ex-name'),fe=document.getElementById('fs-ring-fill'),ge=document.getElementById('fs-ring-glow'),ne=document.getElementById('fs-next');if(te)te.textContent=m+':'+(s<10?'0':'')+s;if(ee)ee.textContent=restExName;const off=RING_CIRC*(1-left/restTotalSecs),w=left<=10;if(fe){fe.style.strokeDashoffset=off;fe.style.stroke=w?'#ff4444':'var(--lime)';fe.style.filter=w?'drop-shadow(0 0 8px rgba(255,68,68,.6))':'drop-shadow(0 0 8px rgba(198,255,0,.6))';}if(ge){ge.style.strokeDashoffset=off;ge.style.stroke=w?'#ff4444':'var(--lime)';}if(te)te.style.color=w?'var(--red)':'var(--lime)';if(ne)ne.textContent=Math.floor(restTotalSecs/60)+':'+String(restTotalSecs%60).padStart(2,'0')+' rest period';}
function skipTimer(){clearInterval(restInterval);restInterval=null;restEndTime=0;try{localStorage.removeItem('trk-timer');}catch(e){}hideFST();relWL();postSW({type:'CANCEL'});}
function adjustTimer(delta){if(!restEndTime)return;restEndTime+=delta*1000;restTotalSecs=Math.max(restTotalSecs+delta,Math.ceil((restEndTime-Date.now())/1000));if(restEndTime<=Date.now()){finishTimer();return;}try{localStorage.setItem('trk-timer',JSON.stringify({end:restEndTime,total:restTotalSecs,ex:restExName}));}catch(e){}updateTimer();if(navigator.vibrate)navigator.vibrate(15);}
function restoreTimer(){try{const r=localStorage.getItem('trk-timer');if(!r)return;const{end,total,ex}=JSON.parse(r);if(end>Date.now()){restEndTime=end;restTotalSecs=total;restExName=ex;showFST();reqWL();updateTimer();restInterval=setInterval(tick,250);}else localStorage.removeItem('trk-timer');}catch(e){}}
function fmtRest(s){if(!s)return'';if(s>=60){const m=s/60;return m===Math.floor(m)?m+'m rest':Math.floor(m)+'.5m rest';}return s+'s rest';}

function closeGrocery(e){if(e.target.id==='gr-backdrop')document.getElementById('gr-backdrop').classList.remove('active');}
function closeGroceryForce(){document.getElementById('gr-backdrop').classList.remove('active');}
function renderGroceryBody(){const all=[...GROCERY_BASE,...groceryCustom],bought=all.filter(x=>groceryChecked[x.id]).length,cats=[...new Set(all.map(x=>x.cat))];let html=`<div class="gr-progress"><span>${bought}</span>/${all.length} items in cart</div>`;cats.forEach(cat=>{html+=`<div class="gr-cat-hdr">${esc(cat)}</div>`;all.filter(x=>x.cat===cat).forEach(item=>{const done=!!groceryChecked[item.id],isCust=!!groceryCustom.find(x=>x.id===item.id);html+=`<div class="gr-item" onclick="toggleGroceryItem('${esc(item.id)}')"><div class="cb${done?' done':''}"><div class="ck"></div></div><div class="gr-item-info"><div class="gr-item-name${done?' done':''}">${esc(item.name)}</div>${item.qty?`<div class="gr-item-qty">${esc(item.qty)}</div>`:''}</div>${isCust?`<button class="gr-item-rm" onclick="event.stopPropagation();removeGroceryCustom('${esc(item.id)}')">×</button>`:''}</div>`;});});html+=`<div class="gr-add-row"><input class="gr-add-input" id="gr-new-name" placeholder="Add item…" autocomplete="off" onkeydown="if(event.key==='Enter')document.getElementById('gr-new-qty').focus()"><input class="gr-qty-input" id="gr-new-qty" placeholder="Qty" autocomplete="off" onkeydown="if(event.key==='Enter')addGroceryCustom()"><button class="gr-add-btn" onclick="addGroceryCustom()">Add</button></div><div class="gr-footer"><button class="gr-footer-btn danger" onclick="clearGroceryChecked()">Uncheck All</button><button class="gr-footer-btn" onclick="closeGroceryForce()">Done</button></div>`;document.getElementById('gr-body').innerHTML=html;}

function check(id){if(isCoachView)return;st[id]=!st[id];save();render();if(navigator.vibrate)navigator.vibrate(10);}
function toggleSec(k){op[k]=!op[k];render();}
function toggleMealSec(k){mealOp[k]=!mealOp[k];render();}
function toggleEx(k){exop[k]=!exop[k];render();}
function switchDay(d){day=d;editingMeal=null;if(syncSessionId)pushSync();render();window.scrollTo({top:0,behavior:'smooth'});}
function setMode(m){if(isCoachView)return;mode=m;editingMeal=null;document.getElementById('mb-workout').classList.toggle('active',m==='workout');document.getElementById('mb-nutrition').classList.toggle('active',m==='nutrition');if(syncSessionId)pushSync();render();}
function markSet(k,name,secs){if(isCoachView)return;if(!ws[k])ws[k]={};const i=document.getElementById('inp-'+k),r=document.getElementById('rep-'+k);if(i&&i.value)ws[k].w=i.value;if(r&&r.value)ws[k].r=r.value;ws[k].done=true;save();render();if(navigator.vibrate)navigator.vibrate([20,40,20]);startRestTimer(secs,name);}
function undoSet(k){if(isCoachView)return;if(ws[k])ws[k].done=false;save();render();}
function wInput(k,v){if(isCoachView)return;if(!ws[k])ws[k]={};ws[k].w=v;dSave();}
function rInput(k,v){if(isCoachView)return;if(!ws[k])ws[k]={};ws[k].r=v;dSave();}
function addWater(d,n){if(isCoachView)return;wtr[d]=(wtr[d]||0)===n?n-1:n;save();render();}
function resetDay(d){if(isCoachView)return;if(!confirm('Reset '+DNAMES[d]+'?'))return;[`${d}|am`,`${d}|pc`].forEach(id=>st[id]=false);getSetKeys(d).forEach(k=>{if(ws[k])ws[k].done=false;});wtr[d]=0;save();render();showToast('Day reset');}
function addSet(d,ei){if(isCoachView)return;EX[d][ei].s++;exop[`${d}-${ei}`]=true;save();render();}
function removeSet(d,ei){if(isCoachView)return;const ex=EX[d][ei];if(ex.s<=1){showToast('Minimum 1 set');return;}const lk=sk(d,ei,ex.s-1);if(ws[lk]&&(ws[lk].done||ws[lk].w||ws[lk].r)){if(!confirm('Remove last set?'))return;}delete ws[lk];ex.s--;save();render();}
function removeExercise(d,ei){if(isCoachView)return;if(!confirm('Remove "'+EX[d][ei].n+'"?'))return;for(let si=0;si<EX[d][ei].s;si++)delete ws[sk(d,ei,si)];const ol=EX[d].length;EX[d].splice(ei,1);for(let i=ei+1;i<ol;i++)for(let si=0;si<20;si++){const ok=`${d}|${i}|${si}`,nk=`${d}|${i-1}|${si}`;if(ws[ok]){ws[nk]=ws[ok];delete ws[ok];}}const neo={};Object.keys(exop).forEach(k=>{const[kd,kei]=k.split('-');if(kd!==d){neo[k]=exop[k];return;}const idx=parseInt(kei,10);if(idx<ei)neo[k]=exop[k];else if(idx>ei)neo[`${kd}-${idx-1}`]=exop[k];});exop=neo;save();render();showToast('Exercise removed');}
function openAddExercise(d){if(isCoachView)return;const body=`<div class="modal-field"><label class="modal-label">Exercise name</label><input class="modal-input" id="ae-name" placeholder="e.g. Cable lateral raise" autocomplete="off"></div><div class="modal-grid3"><div class="modal-field"><label class="modal-label">Sets</label><input class="modal-input" id="ae-sets" type="number" min="1" max="20" value="3" inputmode="numeric"></div><div class="modal-field"><label class="modal-label">Reps</label><input class="modal-input" id="ae-reps" placeholder="8-12" value="8-12"></div><div class="modal-field"><label class="modal-label">Rest (sec)</label><input class="modal-input" id="ae-rest" type="number" min="0" max="600" value="90" inputmode="numeric"></div></div><div class="modal-hint">Rest in seconds — 60, 90, 120, 180…</div><div class="modal-actions"><button class="modal-btn" onclick="closeModalForce()">Cancel</button><button class="modal-btn primary" onclick="confirmAddExercise('${d}')">Add</button></div>`;openModal('Add Exercise',body);setTimeout(()=>{const f=document.getElementById('ae-name');if(f)f.focus();},350);}
function confirmAddExercise(d){const name=(document.getElementById('ae-name').value||'').trim(),sets=parseInt(document.getElementById('ae-sets').value,10),reps=(document.getElementById('ae-reps').value||'').trim(),rest=parseInt(document.getElementById('ae-rest').value,10)||0;if(!name){showToast('Name required');return;}if(!sets||sets<1){showToast('Sets must be ≥ 1');return;}if(!reps){showToast('Reps required');return;}EX[d].push({n:name,s:sets,r:reps,rest,note:''});exop[`${d}-${EX[d].length-1}`]=true;save();closeModalForce();render();showToast('Exercise added');}
function toggleEditMeal(mid){if(isCoachView)return;editingMeal=editingMeal===mid?null:mid;render();}
function addMealItem(mid){if(isCoachView)return;const inp=document.getElementById('meal-add-'+mid);if(!inp)return;const val=inp.value.trim();if(!val){showToast('Enter an item');return;}const m=MEALS.find(x=>x.id===mid);if(!m)return;m.items.push(val);inp.value='';save();render();}
function removeMealItem(mid,idx){if(isCoachView)return;const m=MEALS.find(x=>x.id===mid);if(!m)return;m.items.splice(idx,1);save();render();}
function updateMealMeta(mid,field,val){if(isCoachView)return;const m=MEALS.find(x=>x.id===mid);if(!m)return;m[field]=val;dSave();}
function addMeal(){if(isCoachView)return;MEALS.push({id:'m'+Date.now(),label:'New Meal',time:'',cal:'',items:[]});save();render();}
function removeMeal(mid){if(isCoachView)return;if(!confirm('Remove this meal?'))return;MEALS=MEALS.filter(x=>x.id!==mid);editingMeal=null;save();render();}
function addSupp(){if(isCoachView)return;const inp=document.getElementById('supp-add-input');if(!inp)return;const val=inp.value.trim();if(!val)return;SUPPS.push(val);inp.value='';save();render();}
function removeSupp(i){if(isCoachView)return;SUPPS.splice(i,1);save();render();}
function openModal(title,body){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=body;document.getElementById('modal-backdrop').classList.add('active');}
function closeModal(e){if(e.target.id==='modal-backdrop')closeModalForce();}
function closeModalForce(){document.getElementById('modal-backdrop').classList.remove('active');}

function ciHTML(id,label,note){const done=!!st[id];return`<div class="ci" onclick="check('${esc(id)}')"><div class="cb${done?' done':''}"><div class="ck"></div></div><div><div class="ci-text${done?' done':''}">${esc(label)}</div>${note?`<div class="ci-note">${esc(note)}</div>`:''}</div></div>`;}
function secHTML(key,ic,txt,title,sub,body,ds){const isO=!!op[key],[a,b]=ds.split('/'),allD=a===b&&ds!=='0/0';return`<div class="section${isO?' open-section':''}"><div class="sec-head" onclick="toggleSec('${key}')"><div class="sec-icon ${ic}">${txt}</div><div class="sec-title">${esc(title)}${sub?`<span class="sec-sub">${esc(sub)}</span>`:''}</div><div class="sec-count${allD?' done':''}">${ds}</div><div class="sec-chev${isO?' open':''}">▾</div></div><div class="sec-body${isO?' open':''}">${body}</div></div>`;}

function wkHTML(d){
  const exs=EX[d],isRest=WK[d].badge==='Rest';
  const tot=isRest?exs.length:exs.reduce((a,e)=>a+e.s,0);
  const done=isRest?exs.filter((_,ei)=>ws[sk(d,ei,0)]&&ws[sk(d,ei,0)].done).length:exs.reduce((a,e,ei)=>a+Array.from({length:e.s},(_,si)=>ws[sk(d,ei,si)]&&ws[sk(d,ei,si)].done?1:0).reduce((x,y)=>x+y,0),0);
  const exsH=exs.map((e,ei)=>{
    const ekey=`${d}-${ei}`,isExO=!!exop[ekey];
    if(isRest){const k=sk(d,ei,0),dn=ws[k]&&ws[k].done;return`<div class="ci" onclick="(function(){if(isCoachView)return;var k='${esc(k)}';if(!ws[k])ws[k]={};ws[k].done=!ws[k].done;save();render();if(navigator.vibrate)navigator.vibrate(10);})()" style="padding:12px 0"><div class="cb${dn?' done':''}"><div class="ck"></div></div><div><div class="ci-text${dn?' done':''}">${esc(e.n)}</div><div class="ci-note">${esc(e.r)}${e.note?' · '+esc(e.note):''}</div></div></div>`;}
    const sd=Array.from({length:e.s},(_,si)=>ws[sk(d,ei,si)]&&ws[sk(d,ei,si)].done?1:0).reduce((a,b)=>a+b,0),allSD=sd===e.s,rl=fmtRest(e.rest);
    const sH=Array.from({length:e.s},(_,si)=>{const k=sk(d,ei,si),sv=ws[k]||{};if(sv.done){const lg=[sv.w?sv.w+' lbs':null,sv.r?sv.r+' reps':null].filter(Boolean).join(' × ');return`<div class="set-row"><div class="set-done-icon"></div><div class="set-label sdone">Set ${si+1}</div><div class="set-logged">${lg||'—'}</div>${isCoachView?'':'<button class="set-undo-btn" onclick="undoSet(\''+k+'\')">Undo</button>'}</div>`;}return`<div class="set-row"><div class="set-label">Set<br>${si+1}</div><input class="set-w-input" type="number" id="inp-${k}" min="0" step="5" inputmode="decimal" placeholder="${sv.w||'lbs'}" value="${sv.w||''}" oninput="wInput('${k}',this.value)" onclick="event.stopPropagation()"${isCoachView?' disabled':''}><div class="set-sep">×</div><input class="set-r-input" type="number" id="rep-${k}" min="0" step="1" inputmode="numeric" placeholder="${sv.r||'reps'}" value="${sv.r||''}" oninput="rInput('${k}',this.value)" onclick="event.stopPropagation()"${isCoachView?' disabled':''}><div class="set-spacer"></div>${isCoachView?'':'<button class="set-done-btn" onclick="markSet(\''+k+'\',\''+esc(e.n)+' · Set '+(si+1)+'\','+e.rest+')">Done</button>'}</div>`;}).join('');
    const ctrl=isCoachView?'':(`<div class="set-ctrl-row"><button class="set-ctrl-btn rm" onclick="removeSet('${d}',${ei})" ${e.s<=1?'disabled':''}>− Remove Set</button><button class="set-ctrl-btn add" onclick="addSet('${d}',${ei})">+ Add Set</button></div><div class="ex-actions"><button class="ex-rm-btn" onclick="removeExercise('${d}',${ei})">Remove Exercise</button></div>`);
    return`<div class="ex-wrap${isExO?' ex-open':''}"><div class="ex-head" onclick="toggleEx('${ekey}')"><div class="ex-num-badge">${ei+1}</div><div class="ex-info"><div class="ex-name">${esc(e.n)}</div><div class="ex-meta">${e.s}×${esc(e.r)}${rl?' · '+rl:''}${e.note?' · '+esc(e.note):''}</div></div><div class="ex-prog${allSD?' full':''}">${sd}/${e.s}</div><div class="ex-chev${isExO?' open':''}">▾</div></div><div class="ex-body${isExO?' open':''}">${sH}${ctrl}</div></div>`;
  }).join('');
  const addBtn=isCoachView?'':(`<button class="add-btn" onclick="openAddExercise('${d}')"><svg viewBox="0 0 14 14"><line x1="7" y1="2" x2="7" y2="12"/><line x1="2" y1="7" x2="12" y2="7"/></svg>Add Exercise</button>`);
  return`<div class="section open-section"><div class="sec-head" onclick="toggleSec('wk')"><div class="sec-icon ic-wk">WK</div><div class="sec-title">${isRest?'Recovery Tasks':'Workout'}<span class="sec-sub">${esc(WK[d].full)}</span></div><div class="sec-count${done===tot?' done':''}">${done}/${tot}</div><div class="sec-chev open">▾</div></div><div class="sec-body open">${exsH}${addBtn}</div></div>`;
}

function nutrHTML(d){
  let h=`<div class="macros-strip"><div class="mac"><div class="mac-val">~2,310</div><div class="mac-lbl">Cal</div></div><div class="mac"><div class="mac-val">~205g</div><div class="mac-lbl">Protein</div></div><div class="mac"><div class="mac-val">~190g</div><div class="mac-lbl">Carbs</div></div><div class="mac"><div class="mac-val">~70g</div><div class="mac-lbl">Fat</div></div></div>`;
  MEALS.forEach((m,mi)=>{const isO=!!mealOp[m.id],isE=editingMeal===m.id&&!isCoachView;let bh='';if(isE){bh+=`<div class="meal-meta-row"><input class="meal-meta-input" style="flex:2" placeholder="Meal name" value="${esc(m.label)}" oninput="updateMealMeta('${m.id}','label',this.value)"><input class="meal-meta-input" style="flex:1" placeholder="Time" value="${esc(m.time)}" oninput="updateMealMeta('${m.id}','time',this.value)"><input class="meal-meta-input" style="width:80px;flex-shrink:0" placeholder="Cal" value="${esc(m.cal)}" oninput="updateMealMeta('${m.id}','cal',this.value)"></div>`;m.items.forEach((item,ii)=>{bh+=`<div class="meal-item-row"><div class="meal-item-text">${esc(item)}</div><button class="meal-item-rm" onclick="removeMealItem('${m.id}',${ii})">×</button></div>`;});bh+=`<div class="meal-add-row"><input class="meal-add-input" id="meal-add-${m.id}" placeholder="Add food item…" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();addMealItem('${m.id}');}"><button class="meal-add-btn" onclick="addMealItem('${m.id}')">Add</button></div><div style="display:flex;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid var(--border)"><button class="modal-btn" style="background:var(--bg3)" onclick="toggleEditMeal('${m.id}')">Done editing</button><button class="modal-btn" style="color:var(--red);border-color:rgba(255,68,68,.2)" onclick="removeMeal('${m.id}')">Remove</button></div>`;}else{m.items.forEach((item,ii)=>{bh+=ciHTML(`${d}|${m.id}|${ii}`,item,'');});}const dc=m.items.filter((_,ii)=>st[`${d}|${m.id}|${ii}`]).length,allD=dc===m.items.length&&m.items.length>0;h+=`<div class="nutr-section"><div class="nutr-head" onclick="toggleMealSec('${m.id}')"><div class="sec-icon ic-m">M${mi+1}</div><div class="sec-title">${esc(m.label)}<span class="sec-sub">${esc(m.time)}${m.cal?' · '+esc(m.cal):''}</span></div><div class="sec-count${allD?' done':''}">${dc}/${m.items.length}</div>${isCoachView?'':'<button class="edit-meal-btn'+(isE?' active':'')+'" onclick="event.stopPropagation();toggleEditMeal(\''+m.id+'\')">'+(isE?'✓ done':'Edit')+'</button>'}<div class="sec-chev${isO?' open':''}">▾</div></div><div class="nutr-body${isO?' open':''}">${bh}</div></div>`;});
  if(!isCoachView)h+=`<button class="add-btn" onclick="addMeal()"><svg viewBox="0 0 14 14"><line x1="7" y1="2" x2="7" y2="12"/><line x1="2" y1="7" x2="12" y2="7"/></svg>Add Meal</button>`;
  const spD=SUPPS.filter((_,i)=>st[`${d}|sp|${i}`]).length;let sb=SUPPS.map((x,i)=>`<div style="display:flex;align-items:center;gap:6px">${ciHTML(`${d}|sp|${i}`,x,'')}${isCoachView?'':'<button class="meal-item-rm" onclick="event.stopPropagation();removeSupp('+i+')" style="margin-top:-12px;flex-shrink:0">×</button>'}</div>`).join('');
  if(!isCoachView)sb+=`<div class="meal-add-row"><input class="meal-add-input" id="supp-add-input" placeholder="Add supplement…" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();addSupp();}"><button class="meal-add-btn" onclick="addSupp()">Add</button></div>`;
  h+=secHTML('sp','ic-sp','SP','Supplements','Daily protocol',sb,`${spD}/${SUPPS.length}`);
  const wd=wtr[d]||0,drops=[1,2,3,4,5,6,7,8].map(n=>`<div class="drop${wd>=n?' filled':''}" onclick="addWater('${d}',${n})"><div class="drop-inner"></div></div>`).join('');
  h+=`<div class="section${op.h2o?' open-section':''}"><div class="sec-head" onclick="toggleSec('h2o')"><div class="sec-icon ic-h2o">H₂O</div><div class="sec-title">Water</div><div class="sec-count${wd>=8?' done':''}">${wd}/8</div><div class="sec-chev${op.h2o?' open':''}">▾</div></div>${op.h2o?`<div class="water-body"><div class="water-lbl">Target — 4 litres · 8 glasses</div><div class="drops">${drops}<div class="water-count">${wd}/8</div></div></div>`:''}</div>`;
  return h;
}

function render(){
  const d=day,w=WK[d],p=wkProg(d);
  document.getElementById('h-day').innerHTML=`${DNAMES[d]}<span class="h-badge ${w.bc}">${w.badge}</span>`;
  document.getElementById('prog-fill').style.width=p.pct+'%';
  document.getElementById('prog-pct').textContent=p.pct+'%';
  document.getElementById('day-tabs').innerHTML=DAYS.map(dy=>`<div class="day-tab${dy===d?' active':''}" onclick="switchDay('${dy}')">${dy}</div>`).join('');
  let h=`<div class="reset-row">${isCoachView?'':'<button class="reset-btn" onclick="resetDay(\''+d+'\')">Reset '+d+'</button>'}</div>`;
  if(mode==='workout'){h+=secHTML('am','ic-am','AM','Morning Cardio',w.am,ciHTML(`${d}|am`,w.am,w.ams),st[`${d}|am`]?'1/1':'0/1');h+=wkHTML(d);if(w.pc)h+=secHTML('pc','ic-pc','PC','Post-Workout Cardio',w.pc,ciHTML(`${d}|pc`,w.pc,w.pcs),st[`${d}|pc`]?'1/1':'0/1');}else h+=nutrHTML(d);
  document.getElementById('content').innerHTML=h;
  document.getElementById('week-bar').innerHTML=DAYS.map(dy=>{const pp=wkProg(dy);return`<div class="wd" onclick="switchDay('${dy}')"><div class="wd-lbl${dy===d?' today':''}">${dy}</div><div class="wd-ring${dy===d?' today-ring':''}"><div class="wd-fill" style="height:${pp.pct}%"></div><div class="wd-pct">${pp.pct}</div></div></div>`;}).join('');
  updateCartBadge();
  if(syncSessionId&&!isCoachView)document.getElementById('sync-btn').classList.add('sync-on');
}

setInterval(updateSyncBar,5000);
load();loadGrocery();loadSyncPrefs();
if(syncSessionId&&!isCoachView){document.getElementById('sync-bar').style.display='flex';setSyncStatus('live','Live — syncing');document.getElementById('sync-btn').classList.add('sync-on');pushSync();}
if(isCoachView&&coachSessionId){startCoachView(coachSessionId);}
render();restoreTimer();setupSW();
</script>
</body>
</html>
